# Netlify deploy configuration for the Bhavani Group of Institutions site.
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: send every path to index.html so client-side routing works
# (fixes 404 on refresh of /about, /contact, etc.).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
