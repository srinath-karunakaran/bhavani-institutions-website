<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta name="description" content="Bhavani Group of Institutions — Abacus & Vedic Math, Dance, Drawing & Art, Day Care, Music, Sports and School Van Service in Chennai." />

<!-- Local-business structured data (helps Google show the centre in search & maps).
     Update phone/email/URL/geo once the client confirms them. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "name": "Bhavani Group of Institutions",
  "description": "Tuition, Abacus & Vedic Maths, Dance, Drawing & Art, Day Care, Music, Sports and School Van Service across Chennai. Founded 2005.",
  "slogan": "Sincere Guidance. Peaceful Learning.",
  "telephone": "+91-63831-29475",
  "email": "contact@bhavaniedutech.com",
  "foundingDate": "2005",
  "areaServed": "Chennai, Tamil Nadu",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "18/11, Annai Velankanni Nagar, Phase 1, Madhanandapuram",
    "addressLocality": "Chennai",
    "addressRegion": "Tamil Nadu",
    "postalCode": "600125",
    "addressCountry": "IN"
  }
}
</script>
</head>
<body>
  <!-- Hidden static forms so Netlify detects them at build time. The real
       (React) forms POST to these by name. Do not remove. -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="message"></textarea>
  </form>
  <form name="franchise" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="city" />
    <input type="text" name="budget" />
    <input type="text" name="location" />
    <textarea name="message"></textarea>
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
